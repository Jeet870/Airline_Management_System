version: '3.8'

services:
  aeroops-command-center:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aeroops-command-center
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      # Optional external API keys:
      # - VITE_MAPTILER_API_KEY=your_key_here
      # - VITE_WEATHER_API_KEY=your_key_here
